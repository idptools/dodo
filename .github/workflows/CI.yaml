name: CI

# This key was `off:` for the entire life of the repository. YAML 1.1 parses a bare
# `off` as boolean false, so it was not even a misspelled string key -- GitHub saw a
# workflow with no triggers and never ran it. Zero CI signal on a 3,800-line numerics
# package, which is the direct reason bugs survived verbatim from v1 into v2 and an
# engine-less 12.7 KB wheel went unnoticed for months.
#
# Quoted deliberately: "on" cannot then be re-interpreted as a boolean.
"on":
  push:
    branches: [main, v2_nuke_repave]
  pull_request:
    branches: [main, v2_nuke_repave]
  schedule:
    # Weekly, to catch upstream breakage in the scientific stack rather than
    # discovering it mid-release. Exactly this would have caught the AlphaFold DB
    # retiring its model_v4 file URLs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # The single most valuable job here, and the one that was missing: prove a built
  # wheel installs into a clean environment and imports. Everything else is secondary,
  # because a package that does not import cannot be tested at all.
  install:
    name: Wheel installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git history; a shallow clone yields the
          # wrong version or none at all.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl

      - name: Import it
        run: |
          /tmp/clean/bin/python -c "
          import dodo
          from dodo.structure import Structure
          from dodo import constants, exceptions
          print('dodo', dodo.__version__, 'imported cleanly')
          "

      - name: Check the CLI entry point resolves
        run: /tmp/clean/bin/dodo --help

      - name: Verify metadata is publishable
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported version, and they must match requires-python and the
        # "Programming Language :: Python" classifiers in pyproject.toml exactly. There is a
        # test asserting that agreement, because a version claimed in one place and untested in
        # another is a promise nobody checks.
        #
        # 3.11 used to be missing, which was the wrong one to omit: it is the version the
        # package is developed on, so it was the only leg whose result was already known.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Trim the matrix: the middle versions on non-Linux add little signal. The floor and
          # the newest version are tested on all three operating systems.
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and test dependencies
        # With dependencies, unlike the old workflow which ran
        # `pip install . --no-deps` against a conda env that declared no runtime
        # dependencies -- so the one existing test could never have passed.
        run: python -m pip install -e ".[test]"

      - name: Run tests
        # Network tests are deselected here and run in a dedicated job, so a flaky
        # connection or an upstream outage does not redden the whole matrix.
        run: >-
          python -m pytest
          -m "not network"
          --cov=dodo
          --cov-report=xml
          --cov-report=term-missing
          -v

      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # The declared dependency floors, which every other job silently avoids testing.
  #
  # `pip install -e ".[test]"` resolves the NEWEST numpy and scipy, so `numpy>=2.0` and
  # `scipy>=1.13` in pyproject.toml were an untested promise -- on Python 3.12 that install
  # resolves numpy 2.5.x, four minor versions above the floor. This job installs the exact
  # lower bounds the metadata permits.
  #
  # Deliberately NOT done by pinning versions in pyproject.toml: that would force the same
  # versions on every user and make DODO hard to co-install with anything else. The floors stay
  # as `>=` ranges for users, and this job is what verifies the low end of those ranges.
  # ---------------------------------------------------------------------------
  floors:
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # The oldest Python the floor combination supports: numpy 2.1 dropped 3.9, and
          # numpy 2.0 is the last release that supports it, so 3.10 is where the true floor of
          # every declared range coexists.
          python-version: "3.10"
          cache: pip

      - name: Install the package, then force the declared minimums
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "numpy==2.0.*" "scipy==1.13.*" "getSequence==3.0.*"

      - name: Show what actually resolved
        # Printed, because a floor job that silently resolved something newer would pass while
        # testing nothing. Verified locally at numpy 2.0.0 / scipy 1.13.0 as well.
        run: |
          python -c "import sys, numpy, scipy, importlib.metadata as m; print(sys.version); print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('getSequence', m.version('getSequence'))"

      - name: Run tests
        run: python -m pytest -m "not network" -q

  # ---------------------------------------------------------------------------
  # Docs. Nothing in .github referenced sphinx before, which is why docs/ was still the 2018
  # cookiecutter: an api.rst pointing at a `dodo.canvas` module that does not exist, a 4-line
  # getting-started stub, and a readthedocs.yml using `build: image` and `python: version: 3.8`,
  # both removed from Read the Docs' schema years ago. The hosted build had been failing
  # silently for as long as it had existed.
  #
  # -W matches readthedocs.yml's fail_on_warning, so a broken cross-reference or a malformed
  # docstring section fails here rather than on Read the Docs.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and the docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build the docs, warnings as errors
        run: python -m sphinx -b html -W docs docs/_build/html

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check src tests
      - name: ruff format
        run: python -m ruff format --check src tests
      - name: mypy
        run: python -m mypy

  network:
    name: Network-dependent tests
    runs-on: ubuntu-latest
    # Only on the default branch and on a schedule. These hit the AlphaFold DB, RCSB
    # and UniProt, so they are inherently flaky and must not gate pull requests.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,lookup]"
      - name: Run network tests
        run: python -m pytest -m network -v
