[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

# Moved off setuptools + versioningit. Two concrete reasons:
#  - The old config used [tool.setuptools.packages.find] with `namespaces = false`,
#    which silently excluded dodo/backend (it had no __init__.py) from every wheel and
#    sdist. The result was a 12.7 KB wheel containing none of the engine, while
#    `pip install .` still exited 0. A src layout with an explicit packages entry
#    cannot fail that way.
#  - versioningit emitted local version segments ("0.0.0+36.g45f3738"), and building
#    from a tarball produced "1+unknown". PyPI rejects local version segments.

[project]
name = "dodo"
description = "Rebuild the disordered regions of predicted protein structures so they look like IDRs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
    { name = "Ryan Emenecker - Holehouse Lab", email = "remenecker@wustl.edu" },
]
keywords = [
    "protein",
    "intrinsically disordered region",
    "IDR",
    "AlphaFold",
    "structural biology",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# Runtime dependencies are deliberately minimal: numpy and scipy only. That is what
# makes the "lite" install viable -- `pip install dodo` gets a working package that
# reads structures, identifies regions and rebuilds IDRs with the random-walk engine,
# without pulling in torch.
#
# Changes from v1's list:
#  - scipy ADDED. It was imported (scipy.spatial.cKDTree, scipy.spatial.distance) but
#    never declared, so a clean install failed at first use.
#  - cython REMOVED. Declared, but no Cython source exists anywhere in the project.
#  - setuptools REMOVED. Never a runtime dependency.
#  - importlib-resources REMOVED. Only needed below Python 3.10, now the floor.
#  - matplotlib MOVED to the [viz] extra; it is only used by the debug plotter.
#  - metapredict and getSequence MOVED to extras. Both pull torch transitively, and a
#    module-scope import made even `dodo --help` pay multi-second torch startup.
#  - sparrow MOVED to the [albatross] extra. It was declared as
#    `sparrow @ git+https://git@github.com/idptools/sparrow.git`, which (a) contains a
#    stray "git@" and (b) is a PEP 508 direct reference, which makes the distribution
#    permanently unpublishable to PyPI. See [tool.uv.sources] for the dev pin.
dependencies = [
    # numpy 2 is required, not merely tolerated. NEP 50 changed scalar type promotion, and
    # DODO's geometry mixes Python floats with float32/float64 arrays throughout -- so 1.x and
    # 2.x can silently disagree on a result dtype. Pinning the floor at 2.0 means there is one
    # promotion rule to reason about instead of two, which for numerical code is the difference
    # between a defined behaviour and a version-dependent one.
    "numpy>=2.0",
    # scipy 1.13.0 is the first release built against numpy 2, so anything older cannot coexist
    # with the pin above. Raised from >=1.10 for that reason, not for a feature.
    "scipy>=1.13",
]

[project.optional-dependencies]
# ALBATROSS end-to-end / Rg prediction. Without it, DODO falls back to an analytical
# polymer scaling law (constants.flory_end_to_end) that is sequence-blind and
# explicitly documented as an approximation.
albatross = ["sparrow"]

# Sequence-based disorder prediction, as an alternative to the structure-based contact
# score, and the sequence-only region identification path.
predictors = ["metapredict>=3.0"]

# Resolve a protein name to a UniProt accession, for the fetch-by-name workflow.
lookup = ["getSequence"]

# STARLING generative IDR ensembles. Heavy: ~2.4 GB of weights plus a large dependency
# tree. Optional by design, never vendored.
starling = ["starling-ensemble"]

# The matplotlib debug plotter. 3.9 is the first release supporting numpy 2, so it is the floor
# implied by the numpy>=2.0 runtime pin rather than a feature requirement.
viz = ["matplotlib>=3.9"]

all = ["dodo[albatross,predictors,lookup,starling,viz]"]

test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

dev = [
    "dodo[test]",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints",
]

[project.scripts]
# One CLI with subcommands, replacing v1's three separate console scripts
# (pdb-from-name, pdb-from-pdb, pdb-from-sequence). Those were near-duplicate argparse
# files whose shared flags had drifted: -apr meant --attempts_per_region in two of them
# and --attempts_per_residue in the third.
dodo = "dodo.cli:main"

[project.urls]
Homepage = "https://github.com/idptools/dodo"
Source = "https://github.com/idptools/dodo"
Issues = "https://github.com/idptools/dodo/issues"

# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
# Write the resolved version into the package so `dodo.__version__` is accurate in
# editable installs too, not just in built wheels. This file is generated and
# gitignored (.gitignore has */_version.py).
version-file = "src/dodo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dodo"]

[tool.hatch.build.targets.sdist]
# Ship sources and tests, but not the 19 MB of structure fixtures in
# tests/data/structures/. Those are only needed to run the regression suite from a git
# checkout; including them would inflate the sdist roughly 40x for no user benefit.
include = [
    "src/dodo",
    "tests/**/*.py",
    "README.md",
    "LICENSE",
]

# ---------------------------------------------------------------------------
# Development source pins
# ---------------------------------------------------------------------------

[tool.uv.sources]
# sparrow is not on PyPI under this name, so it must come from git. Pinning it here
# rather than in [project.dependencies] keeps published metadata legal while still
# giving developers a reproducible resolve. sparrow itself declares idptools-parrot as
# a git URL, so the chain is two deep and a lockfile is the only way to pin it.
sparrow = { git = "https://github.com/idptools/sparrow.git" }

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "network: requires internet access (deselect with -m 'not network')",
    "slow: takes more than a few seconds",
    "albatross: requires sparrow/ALBATROSS to be installed",
    "starling: requires STARLING to be installed",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
# _version.py is written by hatch-vcs at build time. Linting it means every regeneration
# can reintroduce a violation nobody can fix in source.
extend-exclude = ["src/dodo/_version.py"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "NPY",       # numpy-specific
    "D",         # pydocstyle
]
ignore = [
    "D105",  # magic methods do not need docstrings
    "D107",  # __init__ is documented on the class
    "E741",  # ambiguous name `l`; unavoidable in geometry code
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# The TYPE_CHECKING block re-exports names for type checkers and IDEs; they are
# genuinely unused at runtime because __getattr__ resolves them lazily.
"src/dodo/__init__.py" = ["F401"]
# Tests: docstrings on every test function are noise, and `constants as C` is a
# deliberate, readable abbreviation in a module that references dozens of them.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "N812"]

[tool.mypy]
python_version = "3.10"
files = ["src/dodo"]
strict = true

[[tool.mypy.overrides]]
# scipy's stubs are not precise enough for strict mode, and the optional scientific
# dependencies ship no stubs at all.
module = [
    "scipy.*",
    "sparrow.*",
    "metapredict.*",
    "starling.*",
    "getSequence.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["dodo"]
omit = ["*/tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
