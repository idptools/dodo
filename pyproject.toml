[build-system]
requires = ["hatchling>=1.24", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"


[project]
name = "idptools-dodo"
description = "Rebuild the disordered regions of predicted protein structures so they look like IDRs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
authors = [
    { name = "Ryan Emenecker - Holehouse Lab", email = "remenecker@wustl.edu" },
]
keywords = [
    "protein",
    "intrinsically disordered region",
    "IDR",
    "AlphaFold",
    "structural biology",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]


dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "getSequence>=3.0",
    "tqdm>=4.66",
    "numba>=0.60",
    # Not on PyPI yet, so this has to be a direct git reference. Requires
    # tool.hatch.metadata.allow-direct-references below. DELIBERATE: DODO installs from a
    # GitHub checkout or URL until sparrow itself is on PyPI, at which point this becomes a
    # normal versioned dependency and the flag below can go.
    "sparrow @ git+https://github.com/idptools/sparrow.git",
]

[project.optional-dependencies]

test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.2",
    "types-tqdm",
]

dev = [
    "idptools-dodo[test]",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints",
]

[project.scripts]
dodo = "dodo.cli:main"

[project.urls]
Homepage = "https://github.com/idptools/dodo"
Source = "https://github.com/idptools/dodo"
Issues = "https://github.com/idptools/dodo/issues"

# ---------------------------------------------------------------------------
# Build configuration
# ---------------------------------------------------------------------------

[tool.hatch.metadata]
# Required because `sparrow` is not on PyPI and is declared as a direct git reference.
# Hatchling refuses a direct reference in project.dependencies unless this is set, so
# without it EVERY build fails -- `pip install -e .` dies in "Preparing editable metadata"
# with "Dependency #6 ... cannot be a direct reference", and so do the wheel-build tests.
#
# Consequence, and it is an accepted one rather than an oversight: PyPI rejects uploads
# whose metadata contains a direct reference, so while sparrow is declared this way DODO is
# installed from GitHub and is not published to PyPI. That is the plan until sparrow lands
# on PyPI -- do not "fix" it by dropping sparrow to an optional extra, which would silently
# hand anyone installing without the extra the analytical fallback (measured at 0.62-2.62x
# of ALBATROSS depending on composition) instead of a real prediction.
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
# Write the resolved version into the package so `dodo.__version__` is accurate in
# editable installs too, not just in built wheels. This file is generated and
# gitignored (.gitignore has */_version.py).
version-file = "src/dodo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dodo"]

[tool.hatch.build.targets.sdist]
# Ship sources and tests, but not the 19 MB of structure fixtures in
# tests/data/structures/. Those are only needed to run the regression suite from a git
# checkout; including them would inflate the sdist roughly 40x for no user benefit.
include = [
    "src/dodo",
    "tests/**/*.py",
    "README.md",
    "LICENSE",
]

# ---------------------------------------------------------------------------
# Development source pins
# ---------------------------------------------------------------------------

[tool.uv.sources]
# sparrow is not on PyPI under this name, so it must come from git. Pinning it here
# rather than in [project.dependencies] keeps published metadata legal while still
# giving developers a reproducible resolve. sparrow itself declares idptools-parrot as
# a git URL, so the chain is two deep and a lockfile is the only way to pin it.
sparrow = { git = "https://github.com/idptools/sparrow.git" }

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "network: requires internet access (deselect with -m 'not network')",
    "slow: takes more than a few seconds",
    "albatross: requires sparrow/ALBATROSS to be installed",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
# _version.py is written by hatch-vcs at build time. Linting it means every regeneration
# can reintroduce a violation nobody can fix in source.
extend-exclude = ["src/dodo/_version.py"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "NPY",       # numpy-specific
    "D",         # pydocstyle
]
ignore = [
    "D105",  # magic methods do not need docstrings
    "D107",  # __init__ is documented on the class
    "E741",  # ambiguous name `l`; unavoidable in geometry code
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/dodo/__init__.py" = ["F401"]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "N812"]

"src/dodo/construct/backbone_kernel.py" = ["E702", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
files = ["src/dodo"]
strict = true

[[tool.mypy.overrides]]
# scipy's stubs are not precise enough for strict mode, and the optional scientific
# dependencies ship no stubs at all.
module = [
    "scipy.*",
    "sparrow.*",
    "getSequence.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Annotations inside an njit function are erased -- numba infers its own types from the call site and
# mypy cannot see into the compiled body -- so requiring them buys noise on 200 lines of scalar
# arithmetic. The module's public entry point, refine_region, is annotated and checked as usual.
module = ["dodo.construct.backbone_kernel"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["numba.*", "llvmlite.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["dodo"]
omit = ["*/tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
